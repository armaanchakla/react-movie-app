<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MovieFlix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* DARK MODE */
    #darkToggle:checked ~ .page {
      background:#020617;
      color:#f8fafc;
    }

    #darkToggle:checked ~ .page .card {
      background:#020617;
      border:1px solid #1e293b;
    }

    #darkToggle:checked ~ .page nav {
      background:#020617;
    }

    /* FILTER */
    #filter-action:checked ~ .page .movies .card:not(.action),
    #filter-scifi:checked ~ .page .movies .card:not(.scifi),
    #filter-drama:checked ~ .page .movies .card:not(.drama) {
      display:none;
    }

    /* Overlay base */
    .movie-card .overlay {
      opacity: 1;                /* visible on mobile */
      transform: translateY(0);
    }

    /* Desktop hover effect */
    @media (hover:hover) {
      .movie-card .overlay {
        opacity: 0;
        transform: translateY(20px);
      }

      .movie-card:hover .overlay {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /*  BUTTON STYLE */
    .filter-btn {
    padding: 0.5rem 1rem;
    border-radius: 9999px;
    background: #e5e7eb;
    font-size: 0.875rem;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #020617;
  }

  .filter-btn:hover {
    background: #d1d5db;
  }

  </style>
</head>

<body class="bg-gray-100 text-gray-900">

<!-- Controls -->
<input type="checkbox" id="darkToggle" class="hidden">

<input type="radio" id="filter-all" name="filter" class="hidden" checked>
<input type="radio" id="filter-action" name="filter" class="hidden">
<input type="radio" id="filter-scifi" name="filter" class="hidden">
<input type="radio" id="filter-drama" name="filter" class="hidden">

<div class="page min-h-screen transition-all duration-300">

  <!-- NAVBAR -->
  <nav class="bg-white sticky top-0 z-40 shadow">
    <div class="max-w-7xl mx-auto px-4 py-4">

      <!-- Mobile first layout -->
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

        <h1 class="text-2xl font-bold text-red-500 text-center sm:text-left">
          MovieFlix
        </h1>

        <!-- Controls -->
        <div class="flex flex-wrap justify-center gap-2">

          <label for="darkToggle"
                 class="px-4 py-2 rounded-full bg-gray-900 text-white text-sm cursor-pointer">
            🌗<!--  Theme -->
          </label>

          <label for="filter-all" class="filter-btn">All</label>
          <label for="filter-action" class="filter-btn">Action</label>
          <label for="filter-scifi" class="filter-btn">Sci-Fi</label>
          <label for="filter-drama" class="filter-btn">Drama</label>
        </div>
      </div>
    </div>
  </nav>

  <!-- MOVIES -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <h2 class="text-xl sm:text-2xl md:text-3xl font-bold mb-6 text-center sm:text-left">
      Popular Movies
    </h2>

    <div class="movies grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

      <div class="movie-card scifi relative rounded-xl overflow-hidden shadow-lg">
        <img
          class="h-full w-full object-cover"
          src="https://images.unsplash.com/photo-1524985069026-dd778a71c7b4"
          alt="Inception"
        />
        <!-- Overlay -->
        <div class="overlay absolute inset-0 bg-black/70 text-white flex flex-col justify-end p-4 transition-all duration-300">
          <h3 class="text-lg font-semibold">Inception</h3>
          <p class="text-sm text-gray-300">Sci-Fi • Thriller</p>
          <div class="flex justify-between items-center mt-2">
            <span class="text-xs bg-green-600 px-2 py-1 rounded">⭐ 8.5</span>
            <button class="text-xs bg-red-500 px-3 py-1 rounded">Details</button>
          </div>
        </div> 
      </div>

      <div class="movie-card action relative rounded-xl overflow-hidden shadow-lg">
        <img
          class="h-full w-full object-cover"
          src="https://images.unsplash.com/photo-1505685296765-3a2736de412f"
          alt="Interstellar"
        />
        <!-- Overlay -->
        <div class="overlay absolute inset-0 bg-black/70 text-white flex flex-col justify-end p-4 transition-all duration-300">
          <h3 class="text-lg font-semibold">Interstellar</h3>
          <p class="text-sm text-gray-300">Sci-Fi • Adventure</p>
          <div class="flex justify-between items-center mt-2">
            <span class="text-xs bg-green-600 px-2 py-1 rounded">⭐ 8.1</span>
            <button class="text-xs bg-red-500 px-3 py-1 rounded">Details</button>
          </div>
        </div>
      </div>

      
      <div class="movie-card action relative rounded-xl overflow-hidden shadow-lg">
        <img
          class="h-full w-full object-cover"
          src="https://images.unsplash.com/photo-1509347528160-9a9e33742cdb"
          alt="The Dark Knight"
        />
        <!-- Overlay -->
        <div class="overlay absolute inset-0 bg-black/70 text-white flex flex-col justify-end p-4 transition-all duration-300">
          <h3 class="text-lg font-semibold">The Dark Knight</h3>
          <p class="text-sm text-gray-300">Action • Adventure</p>
          <div class="flex justify-between items-center mt-2">
            <span class="text-xs bg-green-600 px-2 py-1 rounded">⭐ 8.8</span>
            <button class="text-xs bg-red-500 px-3 py-1 rounded">Details</button>
          </div>
        </div>
      </div>

      <div class="movie-card action relative rounded-xl overflow-hidden shadow-lg">
        <img
          class="h-full w-full object-cover"
          src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
          alt="Joker"
        />
        <!-- Overlay -->
        <div class="overlay absolute inset-0 bg-black/70 text-white flex flex-col justify-end p-4 transition-all duration-300">
          <h3 class="text-lg font-semibold">Joker</h3>
          <p class="text-sm text-gray-300">Drama • Adventure</p>
          <div class="flex justify-between items-center mt-2">
            <span class="text-xs bg-green-600 px-2 py-1 rounded">⭐ 8.4</span>
            <button class="text-xs bg-red-500 px-3 py-1 rounded">Details</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-6 text-sm text-gray-500">
    © 2026 MovieFlix
  </footer>

</div>

</body>
</html>
